# Preserve Omarchy's hooks and add a bounded TPM attempt before passphrase input.
_jeebis_hooks=()
for _jeebis_hook in "${HOOKS[@]}"; do
    [[ $_jeebis_hook == jeebis-tpm2 ]] && continue
    [[ $_jeebis_hook == encrypt ]] && _jeebis_hooks+=(jeebis-tpm2)
    _jeebis_hooks+=("$_jeebis_hook")
done
HOOKS=("${_jeebis_hooks[@]}")
unset _jeebis_hooks _jeebis_hook

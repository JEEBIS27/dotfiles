# Alt owns the Herdr/tmux layer; regular actions need no prefix.
set -g prefix C-Space
set -g prefix2 C-b
bind C-Space send-prefix
bind q source-file ~/.config/tmux/tmux.conf \; display-message "Configuration reloaded"
bind ? list-keys
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
# Retire the former global pane/tab/session shortcuts when reloading.
unbind -n M-Enter
unbind -n M-S-Enter
unbind -n M-Escape
unbind -n C-M-Left
unbind -n C-M-Down
unbind -n C-M-Up
unbind -n C-M-Right
unbind -n C-M-S-Left
unbind -n C-M-S-Down
unbind -n C-M-S-Up
unbind -n C-M-S-Right
unbind -n M-Left
unbind -n M-Down
unbind -n M-Up
unbind -n M-Right
unbind -n M-S-Left
unbind -n M-S-Down
unbind -n M-S-Up
unbind -n M-S-Right
# Retire old pane keys before installing the new bindings on reload.
unbind -n M-h
unbind -n M-H
unbind -n M-i
unbind -n M-I
unbind -q -T exchange h
unbind -q -T exchange j
unbind -q -T exchange k
unbind -q -T exchange l
unbind -q -T exchange a
unbind -q -T exchange o
unbind -q -T exchange e
unbind -q -T exchange i
bind -n M-@mod:h@ select-pane -L
bind -n M-@mod:H@ resize-pane -L 5
bind -n M-Left select-pane -L
bind -n M-S-Left resize-pane -L 5
bind -T exchange @plain:h@ swap-pane -t '{left-of}'
bind -T exchange Left swap-pane -t '{left-of}'
bind -n M-@mod:j@ select-pane -D
bind -n M-@mod:J@ resize-pane -D 5
bind -n M-Down select-pane -D
bind -n M-S-Down resize-pane -D 5
bind -T exchange @plain:j@ swap-pane -t '{down-of}'
bind -T exchange Down swap-pane -t '{down-of}'
bind -n M-@mod:k@ select-pane -U
bind -n M-@mod:K@ resize-pane -U 5
bind -n M-Up select-pane -U
bind -n M-S-Up resize-pane -U 5
bind -T exchange @plain:k@ swap-pane -t '{up-of}'
bind -T exchange Up swap-pane -t '{up-of}'
bind -n M-@mod:l@ select-pane -R
bind -n M-@mod:L@ resize-pane -R 5
bind -n M-Right select-pane -R
bind -n M-S-Right resize-pane -R 5
bind -T exchange @plain:l@ swap-pane -t '{right-of}'
bind -T exchange Right swap-pane -t '{right-of}'
bind -T exchange Escape switch-client -T root
bind -T exchange Any switch-client -T root
bind -T exchange PageUp swap-window -t -1
bind -T exchange PageDown swap-window -t +1
bind -T exchange M-F5 swap-window -t -1
bind -T exchange M-F6 swap-window -t +1
bind -n M-e switch-client -T exchange
bind -n M-Enter run-shell '@tmux-helper@ capture-cwd #{pane_id}' \; split-window -h -c "#{@jeebis-cwd}"
bind -n M-S-Enter run-shell '@tmux-helper@ capture-cwd #{pane_id}' \; split-window -v -c "#{@jeebis-cwd}"
bind -n M-w kill-pane
bind -n M-W confirm-before -p 'Close window #W? (y/n)' kill-window
bind -n M-F resize-pane -Z
bind -n M-n run-shell '@tmux-helper@ capture-cwd #{pane_id}' \; new-window -c "#{@jeebis-cwd}"
bind -n M-N run-shell '@tmux-helper@ capture-cwd #{pane_id}' \; new-session -c "#{@jeebis-cwd}"
bind -n M-y run-shell '@tmux-helper@ capture-cwd #{pane_id}' \; split-window -h -c "#{@jeebis-cwd}" '@fish@ -i -c __jeebis_yazi'
bind -n M-Y copy-mode
bind -n M-f copy-mode \; command-prompt -p Search "send-keys -X search-backward -- '%%'"
# A dedicated session keeps the shell alive when Alt+T dismisses the popup.
# Clear TMUX for the inner client; explicitly retain this server's socket.
bind -n M-t if-shell -F '#{m:__popup_*,#{session_name}}' { detach-client } { run-shell '@tmux-helper@ capture-cwd #{pane_id}' ; run-shell 'tmux -S #{q:socket_path} display-popup -E -w 80% -h 80% -d #{q:@jeebis-cwd} env -u TMUX tmux -S #{q:socket_path} new-session -A -s __popup_#{q:session_id}' }
bind -n M-T next-layout
bind -n M-Tab next-window
bind -n M-BTab previous-window
bind -n M-F9 previous-window
bind -n M-PageUp previous-window
bind -n M-PageDown next-window
bind -n M-S-PageUp switch-client -p
bind -n M-S-PageDown switch-client -n
# Keep legacy terminal Page adapters as aliases for old clients.
bind -n M-F5 previous-window
bind -n M-F6 next-window
bind -n M-F7 switch-client -p
bind -n M-F8 switch-client -n
bind -n M-g choose-tree -s -F '#{E:@jeebis-tree-format}'
bind -n M-r command-prompt -I '#W' "rename-window -- '%%'"
bind -n M-R command-prompt -I '#S' "rename-session -- '%%'"
bind -n M-d detach-client
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# General
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 50
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on
setw -g aggressive-resize on
set -g detach-on-destroy no-detached
set -g extended-keys on
set -g extended-keys-format csi-u
set -ag terminal-features "xterm-kitty:extkeys,wezterm:extkeys,xterm-ghostty:extkeys,xterm-256color:extkeys"
set -as terminal-features ",*:clipboard"
set -sg escape-time 50

# Status bar
set -g status-position top
set -g status on
set -g status-interval 5
set -g status-left-length 24
set -g status-right-length 32
set -g window-status-separator "  "
# Reset the former two-row layout when reloading.
set -gu status-format
# tmux-1password opens only on demand; status refreshes never trigger op.
set -g @1password-copy-to-clipboard on
# Retire the plugin's former prefix binding when reloading.
unbind -T prefix u
set -gw automatic-rename on
set -gw automatic-rename-format '#{b:pane_current_path}'
set -g set-titles on
set -g set-titles-string '#h:#W'

# Theme
set -g status-style "bg=default,fg=default"
set -g status-left "#[fg=#a6e3a1,bg=default]#[fg=#1e1e2e,bg=#a6e3a1] #[fg=default,bg=#181825] #S #[fg=#181825,bg=default]#[default]  "
set -g status-right '#(@tmux-helper@ directory #{pane_id} #{client_width})'
set -g window-status-format '#[fg=#a6adc8,bg=default]#(@tmux-helper@ tool #{pane_id}) #I#[default]'
set -g window-status-current-format '#[fg=default,bg=default]#(@tmux-helper@ tool #{pane_id}) #[fg=#1e1e2e,bg=#fab387] #I#[fg=#fab387,bg=default]#[default]'
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=blue"
set -g message-style "bg=default,fg=blue"
set -g message-command-style "bg=default,fg=blue"
set -g mode-style "bg=blue,fg=black"
setw -g clock-mode-colour blue
# Apply tree preview styling when supported by the running server.
setw -gq tree-mode-border-style 'fg=blue,bg=default'
setw -gq tree-mode-preview-style 'fg=blue,bg=default'
setw -gq tree-mode-preview-format ''
set -g popup-border-lines rounded
set -g popup-border-style 'fg=blue,bg=default'
set -g popup-style 'fg=default,bg=default'
set -g @jeebis-tree-format '#{?pane_format,PANE · #{pane_current_command},#{?window_format,WINDOW · #{window_name} · #{pane_title},SESSION · #{session_windows} windows#{?session_attached, · attached,}}}'

# Keep Ctrl reserved for the program in the pane; Alt owns this layer.
bind -n 'M-;' last-pane
# Mark the highlighted item, capture its stable ID, then prompt for its name.
# Normal application input remains literal outside tree-mode.
bind -n r if-shell -F '#{==:#{pane_mode},tree-mode}' { send-keys m ; run-shell '@tmux-helper@ rename window #{q:client_name}' } { send-keys r }
bind -n R if-shell -F '#{==:#{pane_mode},tree-mode}' { send-keys m ; run-shell '@tmux-helper@ rename session #{q:client_name}' } { send-keys R }
# Keep selection unchanged under the modal, then use native tree deletion.
bind -n DC if-shell -F '#{==:#{pane_mode},tree-mode}' { run-shell -b '@tmux-helper@ confirm-delete #{q:client_name} #{pane_id}' } { send-keys DC }
bind -n M-s choose-tree -w -F '#{E:@jeebis-tree-format}'
bind -n M-S choose-tree -s -F '#{E:@jeebis-tree-format}'
bind -n M-D confirm-before -p 'Close session #S? (y/n)' kill-session
# DCS terminal replies start with ESC P, which collides with global Alt+Shift+P.
# Keep pane renaming behind the prefix so replies cannot open a prompt.
unbind -n M-P
bind P command-prompt -I '#{pane_title}' "select-pane -T '%%'"
bind -n M-/ list-keys
bind -n M-, command-prompt -p 'tmux command' "%%"
bind -n M-< source-file ~/.config/tmux/tmux.conf \; display-message "Configuration reloaded"
# Preserve terminal semantics, cwd and the user's current shell for popups.
set -g cursor-style block
# Copy the selection through the compositor clipboard as well as tmux's buffer.
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'wl-copy'
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'wl-copy'
bind -T copy-mode-vi C-c send-keys -X cancel

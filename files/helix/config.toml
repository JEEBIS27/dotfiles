# Ctrl: application operations. Alt: reserved for TUIOS.
theme = "Desktop"

[editor]
true-color = true

[keys.normal]
"C-s" = ":write"
"C-w" = ":quit"
"C-n" = ":new"
"C-f" = "file_picker"
"C-g" = "global_search"
"C-b" = "buffer_picker"
"C-ret" = "vsplit"
"C-S-ret" = "hsplit"
"C-pageup" = "goto_previous_buffer"
"C-pagedown" = "goto_next_buffer"
"C-h" = "jump_view_left"
"C-left" = "jump_view_left"
"C-j" = "jump_view_down"
"C-down" = "jump_view_down"
"C-k" = "jump_view_up"
"C-up" = "jump_view_up"
"C-l" = "jump_view_right"
"C-right" = "jump_view_right"
"C-S-s" = "save_selection"
"C-d" = "changed_file_picker"
"A-!" = "no_op"
"A-(" = "no_op"
"A-)" = "no_op"
"A-*" = "no_op"
"A-," = "no_op"
"A-." = "no_op"
"A-:" = "no_op"
"A-;" = "no_op"
"A-C" = "no_op"
"A-I" = "no_op"
"A-J" = "no_op"
"A-K" = "no_op"
"A-S-down" = "no_op"
"A-U" = "no_op"
"A-_" = "no_op"
"A-`" = "no_op"
"A-a" = "no_op"
"A-b" = "no_op"
"A-c" = "no_op"
"A-d" = "no_op"
"A-down" = "no_op"
"A-e" = "no_op"
"A-i" = "no_op"
"A-left" = "no_op"
"A-minus" = "no_op"
"A-n" = "no_op"
"A-o" = "no_op"
"A-p" = "no_op"
"A-right" = "no_op"
"A-s" = "no_op"
"A-u" = "no_op"
"A-up" = "no_op"
"A-x" = "no_op"
"A-|" = "no_op"

[keys.normal.C-e]
h = "swap_view_left"
j = "swap_view_down"
k = "swap_view_up"
l = "swap_view_right"
left = "swap_view_left"
down = "swap_view_down"
up = "swap_view_up"
right = "swap_view_right"

[keys.normal.space]
A-c = "no_op"

[keys.normal.space.m]
"." = "repeat_last_motion"
"`" = "switch_to_uppercase"
"d" = "delete_selection_noyank"
"c" = "change_selection_noyank"
"C" = "copy_selection_on_prev_line"
"s" = "split_selection_on_newline"
"minus" = "merge_selections"
"_" = "merge_consecutive_selections"
";" = "flip_selections"
"o" = "expand_selection"
"i" = "shrink_selection"
"I" = "select_all_children"
"p" = "select_prev_sibling"
"n" = "select_next_sibling"
"e" = "move_parent_node_end"
"b" = "move_parent_node_start"
"a" = "select_all_siblings"
"x" = "shrink_to_line_bounds"
"*" = "search_selection"
"u" = "earlier"
"U" = "later"
"J" = "join_selections_space"
"K" = "remove_selections"
"," = "remove_primary_selection"
"(" = "rotate_selection_contents_backward"
")" = "rotate_selection_contents_forward"
":" = "ensure_selections_forward"
"|" = "shell_pipe_to"
"!" = "shell_append_output"
"/" = "toggle_line_comments"


# Use Helix defaults for editing, selection, navigation and presentation.
theme = "Desktop"

[editor]
true-color = true

# One shared shortcut retained by choice; :write remains available natively.
# In normal/select mode this replaces Helix's save-selection-to-jumplist key.
[keys.normal]
C-s = ":write"

[keys.insert]
C-s = ":write"

[keys.select]
C-s = ":write"

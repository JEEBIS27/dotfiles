# Logical keys; modules/editor.nix applies files/helix/key-layout.nix.
# Super: desktop. Alt: TUIOS. Ctrl: app. h/j/k/l: spatial; e/w: previous/next.
"theme" = "Desktop"

[editor]
"true-color" = true
"line-number" = "relative"
"cursorline" = true

[editor.cursor-shape]
"normal" = "block"
"insert" = "bar"
"select" = "block"


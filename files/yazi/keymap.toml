# Logical keys. Home Manager applies files/helix/key-layout.nix.
# Literal input and Ctrl/Alt/Super chords are not remapped.

[mgr]
keymap = [
  { on = ["g", "w"], run = "tasks:show", desc = "Show tasks" },
  { on = ["g", "z"], run = "plugin fzf", desc = "Find with fzf" },
  { on = ["g", "Z"], run = "plugin zoxide", desc = "Jump with zoxide" },
  { on = "<C-Enter>", run = "plugin helix-open vsplit", desc = "Helix chooser: open in right split" },
  { on = "<C-S-Enter>", run = "plugin helix-open hsplit", desc = "Helix chooser: open in bottom split" },
  { on = "<C-y>", run = "plugin unified-tabs", desc = "Choose Yazi tab" },
  { on = ["<C-e>", "<PageUp>"], run = "tab_swap -1", desc = "Exchange tab left" },
  { on = ["<C-e>", "<PageDown>"], run = "tab_swap 1", desc = "Exchange tab right" },
  { on = "<C-h>", run = "leave", desc = "Navigate h" },
  { on = "<C-j>", run = "arrow next", desc = "Navigate j" },
  { on = "<C-k>", run = "arrow prev", desc = "Navigate k" },
  { on = "<C-l>", run = "enter", desc = "Navigate l" },
  { on = "<C-Left>", run = "leave", desc = "Navigate h" },
  { on = "<C-Down>", run = "arrow next", desc = "Navigate j" },
  { on = "<C-Up>", run = "arrow prev", desc = "Navigate k" },
  { on = "<C-Right>", run = "enter", desc = "Navigate l" },
  { on = "<C-S-h>", run = "plugin unified-layout shrink", desc = "Resize preview" },
  { on = "<C-S-j>", run = "plugin unified-layout shrink", desc = "Resize preview" },
  { on = "<C-S-k>", run = "plugin unified-layout grow", desc = "Resize preview" },
  { on = "<C-S-l>", run = "plugin unified-layout grow", desc = "Resize preview" },
  { on = "<C-S-Left>", run = "plugin unified-layout shrink", desc = "Resize preview" },
  { on = "<C-S-Down>", run = "plugin unified-layout shrink", desc = "Resize preview" },
  { on = "<C-S-Up>", run = "plugin unified-layout grow", desc = "Resize preview" },
  { on = "<C-S-Right>", run = "plugin unified-layout grow", desc = "Resize preview" },
  { on = "<C-S-f>", run = "plugin unified-layout zoom", desc = "Preview: zoom / restore" },
  { on = "<C-w>", run = "close", desc = "Close current tab (last tab exits with cwd)" },
  { on = "<C-S-w>", run = "quit", desc = "Quit all tabs with cwd" },
  { on = "<C-n>", run = "tab_create --current", desc = "Create tab" },
  { on = "<C-Tab>", run = "tab_switch 1 --relative", desc = "Next tab" },
  { on = "<C-S-Tab>", run = "tab_switch -1 --relative", desc = "Previous tab" },
  { on = "<C-PageUp>", run = "tab_switch -1 --relative", desc = "Previous tab" },
  { on = "<C-PageDown>", run = "tab_switch 1 --relative", desc = "Next tab" },
  { on = "<C-1>", run = "tab_switch 0", desc = "Select tab 1" },
  { on = "<C-2>", run = "tab_switch 1", desc = "Select tab 2" },
  { on = "<C-3>", run = "tab_switch 2", desc = "Select tab 3" },
  { on = "<C-4>", run = "tab_switch 3", desc = "Select tab 4" },
  { on = "<C-5>", run = "tab_switch 4", desc = "Select tab 5" },
  { on = "<C-6>", run = "tab_switch 5", desc = "Select tab 6" },
  { on = "<C-7>", run = "tab_switch 6", desc = "Select tab 7" },
  { on = "<C-8>", run = "tab_switch 7", desc = "Select tab 8" },
  { on = "<C-9>", run = "tab_switch 8", desc = "Select tab 9" },
  { on = "<C-f>", run = "search --via=fd", desc = "Search file names" },
  { on = "<C-g>", run = "search --via=rg", desc = "Search file contents" },
  { on = "<Esc>", run = "escape", desc = "Exit visual mode, clear selection, or cancel search" },
  { on = "<C-[>", run = "escape", desc = "Exit visual mode, clear selection, or cancel search" },
  { on = "q", run = "quit", desc = "Quit the process" },
  { on = "Q", run = "quit --no-cwd-file", desc = "Quit without outputting cwd-file" },
  { on = "k", run = "arrow -1", desc = "Previous file" },
  { on = "j", run = "arrow 1", desc = "Next file" },
  { on = "<Up>", run = "arrow -1", desc = "Previous file" },
  { on = "<Down>", run = "arrow 1", desc = "Next file" },
  { on = "G", run = "arrow bot", desc = "Go to bottom" },
  { on = "<Home>", run = "arrow top", desc = "Go to top" },
  { on = "<End>", run = "arrow bot", desc = "Go to bottom" },
  { on = "<C-u>", run = "arrow -50%", desc = "Move cursor up half page" },
  { on = "<C-d>", run = "arrow 50%", desc = "Move cursor down half page" },
  { on = "<C-b>", run = "arrow -100%", desc = "Move cursor up one page" },
  { on = "<S-PageUp>", run = "arrow -50%", desc = "Move cursor up half page" },
  { on = "<S-PageDown>", run = "arrow 50%", desc = "Move cursor down half page" },
  { on = "h", run = "leave", desc = "Back to the parent directory" },
  { on = "l", run = "enter", desc = "Enter the child directory" },
  { on = "<Left>", run = "leave", desc = "Back to the parent directory" },
  { on = "<Right>", run = "enter", desc = "Enter the child directory" },
  { on = "H", run = "back", desc = "Back to previous directory" },
  { on = "L", run = "forward", desc = "Forward to next directory" },
  { on = "<C-a>", run = "toggle_all --state=on", desc = "Select all files" },
  { on = "<C-r>", run = "toggle_all", desc = "Invert selection of all files" },
  { on = "v", run = "visual_mode", desc = "Enter visual mode (selection mode)" },
  { on = "K", run = "seek -5", desc = "Seek up 5 units in the preview" },
  { on = "J", run = "seek 5", desc = "Seek down 5 units in the preview" },
  { on = "<Tab>", run = "spot", desc = "Spot hovered file" },
  { on = "o", run = "open", desc = "Open selected files" },
  { on = "O", run = "open --interactive", desc = "Open selected files interactively" },
  { on = "<Enter>", run = "open", desc = "Open selected files" },
  { on = "<S-Enter>", run = "open --interactive", desc = "Open selected files interactively" },
  { on = "p", run = "paste", desc = "Paste yanked files" },
  { on = "P", run = "paste --force", desc = "Paste yanked files (overwrite if the destination exists)" },
  { on = "-", run = "link", desc = "Symlink the absolute path of yanked files" },
  { on = "_", run = "link --relative", desc = "Symlink the relative path of yanked files" },
  { on = "<C-->", run = "hardlink", desc = "Hardlink yanked files" },
  { on = ["g", "-"], run = "hardlink", desc = "Hardlink (terminal-safe alternative to Ctrl+-)" },
  { on = "a", run = "create", desc = "Create a file (ends with / for directories)" },
  { on = "A", run = "bulk_create", desc = "Bulk create files" },
  { on = "r", run = "rename --cursor=before_ext", desc = "Rename selected file(s)" },
  { on = ";", run = "shell --interactive", desc = "Run a shell command" },
  { on = ":", run = "shell --block --interactive", desc = "Run a shell command (block until finishes)" },
  { on = ".", run = "hidden toggle", desc = "Toggle the visibility of hidden files" },
  { on = "s", run = "search --via=fd", desc = "Search files by name via fd" },
  { on = "S", run = "search --via=rg", desc = "Search files by content via ripgrep" },
  { on = "<C-s>", run = "escape --search", desc = "Cancel the ongoing search" },
  { on = ["m", "s"], run = "linemode size", desc = "Linemode: size" },
  { on = ["m", "p"], run = "linemode permissions", desc = "Linemode: permissions" },
  { on = ["m", "b"], run = "linemode btime", desc = "Linemode: btime" },
  { on = ["m", "m"], run = "linemode mtime", desc = "Linemode: mtime" },
  { on = ["m", "o"], run = "linemode owner", desc = "Linemode: owner" },
  { on = ["m", "n"], run = "linemode none", desc = "Linemode: none" },
  { on = ["c", "c"], run = "copy path", desc = "Copy file path" },
  { on = ["c", "C"], run = "copy url", desc = "Copy file URL" },
  { on = ["c", "d"], run = "copy dirpath", desc = "Copy directory path" },
  { on = ["c", "D"], run = "copy dirurl", desc = "Copy directory URL" },
  { on = ["c", "f"], run = "copy filename", desc = "Copy filename" },
  { on = ["c", "n"], run = "copy name_without_ext", desc = "Copy filename without extension" },
  { on = "f", run = "filter --smart", desc = "Filter files" },
  { on = "/", run = "find --smart", desc = "Find next file" },
  { on = "?", run = "find --previous --smart", desc = "Find previous file" },
  { on = [",", "m"], run = ["sort mtime --reverse=no", "linemode mtime"], desc = "Sort by modified time" },
  { on = [",", "M"], run = ["sort mtime --reverse=yes", "linemode mtime"], desc = "Sort by modified time (reverse)" },
  { on = [",", "b"], run = ["sort btime --reverse=no", "linemode btime"], desc = "Sort by birth time" },
  { on = [",", "B"], run = ["sort btime --reverse=yes", "linemode btime"], desc = "Sort by birth time (reverse)" },
  { on = [",", "e"], run = "sort extension --reverse=no", desc = "Sort by extension" },
  { on = [",", "E"], run = "sort extension --reverse=yes", desc = "Sort by extension (reverse)" },
  { on = [",", "a"], run = "sort alphabetical --reverse=no", desc = "Sort alphabetically" },
  { on = [",", "A"], run = "sort alphabetical --reverse=yes", desc = "Sort alphabetically (reverse)" },
  { on = [",", "n"], run = "sort natural --reverse=no", desc = "Sort naturally" },
  { on = [",", "N"], run = "sort natural --reverse=yes", desc = "Sort naturally (reverse)" },
  { on = [",", "s"], run = ["sort size --reverse=no", "linemode size"], desc = "Sort by size" },
  { on = [",", "S"], run = ["sort size --reverse=yes", "linemode size"], desc = "Sort by size (reverse)" },
  { on = [",", "r"], run = "sort random --reverse=no", desc = "Sort randomly" },
  { on = ["g", "c"], run = "cd ~/.config", desc = "Go to ~/.config" },
  { on = ["g", "d"], run = "cd ~/Downloads", desc = "Go to ~/Downloads" },
  { on = ["g", "t"], run = "plugin trash", desc = "Go to trash bin" },
  { on = ["g", "<Space>"], run = "cd --interactive", desc = "Jump interactively" },
  { on = ["g", "f"], run = "follow", desc = "Follow hovered symlink" },
  { on = ["g", "b"], run = "tab_create --current", desc = "Create a new tab in CWD" },
  { on = ["g", "B"], run = "tab_rename --interactive", desc = "Rename current tab" },
  { on = "[", run = "tab_switch -1 --relative", desc = "Switch to previous tab" },
  { on = "]", run = "tab_switch 1 --relative", desc = "Switch to next tab" },
  { on = "{", run = "tab_swap -1", desc = "Swap current tab with previous tab" },
  { on = "}", run = "tab_swap 1", desc = "Swap current tab with next tab" },
  { on = "~", run = "help", desc = "Open help" },
  { on = "<F1>", run = "help", desc = "Open help" },
  { on = "w", run = "arrow next", desc = "Next item" },
  { on = "e", run = "arrow prev", desc = "Previous item" },
  { on = "x", run = ["toggle", "arrow next"], desc = "Toggle item and move down" },
  { on = "X", run = ["toggle", "arrow prev"], desc = "Toggle item and move up" },
  { on = "t", run = "toggle --state=on", desc = "Select current item" },
  { on = "<Space>", run = "shell --block --interactive", desc = "Command" },
  { on = "d", run = "remove", desc = "Trash selected files" },
  { on = "<Delete>", run = "remove", desc = "Trash selected files" },
  { on = "D", run = "plugin unified-actions cut", desc = "Cut / uncut selected files" },
  { on = "<C-x>", run = "plugin unified-actions force-cut", desc = "Cut selected files" },
  { on = "<C-c>", run = "plugin ucp copy", desc = "Copy files to system clipboard" },
  { on = "<C-v>", run = "plugin ucp paste", desc = "Paste files from clipboard (native cuts move)" },
  { on = "y", run = "yank", desc = "Internal yank" },
  { on = "Y", run = "plugin ucp copy", desc = "Yank and copy to system clipboard" },
  { on = "V", run = "visual_mode", desc = "Select a range" },
  { on = ["g", "h"], run = "leave", desc = "Parent directory" },
  { on = ["g", "l"], run = "enter", desc = "Enter directory" },
  { on = ["g", "k"], run = "arrow top", desc = "First item" },
  { on = ["g", "j"], run = "arrow bot", desc = "Last item" },
  { on = ["g", "H"], run = "cd ~", desc = "Home directory" },
  { on = "<PageUp>", run = "arrow -50%", desc = "Half page up" },
  { on = "<PageDown>", run = "arrow 50%", desc = "Half page down" },
  { on = "z", run = "plugin archive-actions", desc = "Extract selected archives" },
  { on = "Z", run = "plugin compress", desc = "Compress selected files" },
  { on = ["n", "/"], run = "find_arrow", desc = "Next search result" },
  { on = ["N", "/"], run = "find_arrow --previous", desc = "Previous search result" },
  { on = ["n", "b"], run = "tab_switch 1 --relative", desc = "Next tab" },
  { on = ["N", "b"], run = "tab_switch -1 --relative", desc = "Previous tab" },
  { on = "1", run = "plugin unified-motions 1", desc = "Counted movement" },
  { on = "2", run = "plugin unified-motions 2", desc = "Counted movement" },
  { on = "3", run = "plugin unified-motions 3", desc = "Counted movement" },
  { on = "4", run = "plugin unified-motions 4", desc = "Counted movement" },
  { on = "5", run = "plugin unified-motions 5", desc = "Counted movement" },
  { on = "6", run = "plugin unified-motions 6", desc = "Counted movement" },
  { on = "7", run = "plugin unified-motions 7", desc = "Counted movement" },
  { on = "8", run = "plugin unified-motions 8", desc = "Counted movement" },
  { on = "9", run = "plugin unified-motions 9", desc = "Counted movement" },
]

